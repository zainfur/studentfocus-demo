<svg viewBox="0 0 1400 700" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="skyGradient" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#e0f2fe;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#bae6fd;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="highlight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <mask id="fadeEdges">
      <rect width="1400" height="700" fill="white"/>
      <rect width="150" height="700" fill="url(#fadeLeft)"/>
      <rect x="1250" width="150" height="700" fill="url(#fadeRight)"/>
    </mask>
    <linearGradient id="fadeLeft" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0" />
    </linearGradient>
    <linearGradient id="fadeRight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Sky background -->
  <rect width="1400" height="700" fill="url(#skyGradient)"/>
  
  <g mask="url(#fadeEdges)">
    <!-- BOTTOM: Dense text block -->
    <g opacity="0.9">
      <!-- Text block background -->
      <rect x="200" y="480" width="500" height="180" fill="#fafafa" stroke="#e5e7eb" stroke-width="2" rx="6"/>
      
      <!-- Many lines of dense text -->
      <line x1="220" y1="500" x2="670" y2="500" stroke="#6b7280" stroke-width="2" opacity="0.7"/>
      <line x1="220" y1="515" x2="660" y2="515" stroke="#6b7280" stroke-width="2" opacity="0.7"/>
      <line x1="220" y1="530" x2="680" y2="530" stroke="#6b7280" stroke-width="2" opacity="0.7"/>
      <line x1="220" y1="545" x2="655" y2="545" stroke="#6b7280" stroke-width="2" opacity="0.7"/>
      <line x1="220" y1="560" x2="675" y2="560" stroke="#6b7280" stroke-width="2" opacity="0.7"/>
      
      <!-- The highlighted keyword being extracted -->
      <g filter="url(#glow)">
        <rect x="380" y="570" width="120" height="28" fill="url(#highlight)" rx="4"/>
      </g>
      
      <line x1="220" y1="590" x2="370" y2="590" stroke="#6b7280" stroke-width="2" opacity="0.7"/>
      <line x1="510" y1="590" x2="680" y2="590" stroke="#6b7280" stroke-width="2" opacity="0.7"/>
      <line x1="220" y1="605" x2="665" y2="605" stroke="#6b7280" stroke-width="2" opacity="0.7"/>
      <line x1="220" y1="620" x2="650" y2="620" stroke="#6b7280" stroke-width="2" opacity="0.7"/>
      <line x1="220" y1="635" x2="580" y2="635" stroke="#6b7280" stroke-width="2" opacity="0.7"/>
    </g>
    
    <!-- The keyword floating up -->
    <g filter="url(#glow)">
      <!-- Stage 1: Just lifted from text -->
      <rect x="420" y="520" width="100" height="24" fill="url(#highlight)" rx="4" opacity="0.85"/>
      
      <!-- Stage 2: Rising higher -->
      <rect x="480" y="440" width="90" height="22" fill="url(#highlight)" rx="4" opacity="0.7"/>
      
      <!-- Stage 3: Higher, starting to dissolve -->
      <rect x="560" y="360" width="80" height="20" fill="#fbbf24" rx="4" opacity="0.55"/>
      
      <!-- Stage 4: Breaking apart into particles -->
      <rect x="640" y="290" width="25" height="8" fill="#fbbf24" rx="2" opacity="0.45"/>
      <rect x="670" y="285" width="20" height="7" fill="#f59e0b" rx="2" opacity="0.4"/>
      <circle cx="700" cy="275" r="4" fill="#fb923c" opacity="0.35"/>
    </g>
    
    <!-- Transformation into sound waves -->
    <g opacity="0.8">
      <!-- Stage 5: Becoming wavy -->
      <path d="M 720 250 Q 730 245 740 250 Q 750 255 760 250" stroke="#fb923c" stroke-width="4" fill="none" opacity="0.4" stroke-linecap="round"/>
      
      <!-- Stage 6: More defined waves -->
      <path d="M 780 210 Q 795 200 810 210 Q 825 220 840 210 Q 855 200 870 210" stroke="#f59e0b" stroke-width="4" fill="none" opacity="0.5" stroke-linecap="round"/>
    </g>
    
    <!-- TOP: More keywords floating into the sky -->
    <g filter="url(#glow)">
      <!-- Additional floating keywords at various heights -->
      <g opacity="0.75">
        <rect x="850" y="140" width="95" height="22" fill="#fbbf24" rx="4" opacity="0.7"/>
        <rect x="1050" y="100" width="110" height="24" fill="#f59e0b" rx="4" opacity="0.65"/>
        <rect x="920" y="80" width="85" height="20" fill="#fb923c" rx="4" opacity="0.6"/>
      </g>
      
      <!-- Even higher, more dissolved keywords -->
      <g opacity="0.5">
        <rect x="800" y="60" width="70" height="18" fill="#fbbf24" rx="3" opacity="0.5"/>
        <rect x="1100" y="45" width="80" height="18" fill="#f59e0b" rx="3" opacity="0.45"/>
        <rect x="960" y="30" width="65" height="16" fill="#fb923c" rx="3" opacity="0.4"/>
      </g>
      
      <!-- Musical notes floating -->
      <g opacity="0.7">
        <!-- Note 1 -->
        <ellipse cx="950" cy="250" rx="12" ry="9" fill="#f59e0b" transform="rotate(-20 950 250)"/>
        <line x1="960" y1="247" x2="960" y2="210" stroke="#f59e0b" stroke-width="3"/>
        
        <!-- Note 2 -->
        <ellipse cx="1030" cy="220" rx="12" ry="9" fill="#fbbf24" transform="rotate(-20 1030 220)"/>
        <line x1="1040" y1="217" x2="1040" y2="180" stroke="#fbbf24" stroke-width="3"/>
        
        <!-- Note 3 -->
        <ellipse cx="880" cy="190" rx="11" ry="8" fill="#fb923c" transform="rotate(-20 880 190)"/>
        <line x1="889" y1="187" x2="889" y2="155" stroke="#fb923c" stroke-width="3"/>
      </g>
      
      <!-- Sound waves emanating -->
      <g opacity="0.5">
        <path d="M 820 120 Q 815 105 820 90" stroke="#fbbf24" stroke-width="3" fill="none" stroke-linecap="round"/>
        <path d="M 800 125 Q 793 105 800 85" stroke="#fbbf24" stroke-width="2.5" fill="none" stroke-linecap="round"/>
        
        <path d="M 1140 110 Q 1145 95 1140 80" stroke="#f59e0b" stroke-width="3" fill="none" stroke-linecap="round"/>
        <path d="M 1160 115 Q 1167 95 1160 75" stroke="#f59e0b" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      </g>
    </g>
    
    <!-- Sparkles along the journey -->
    <circle cx="500" cy="470" r="3" fill="#fbbf24" opacity="0.6"/>
    <circle cx="620" cy="350" r="4" fill="#f59e0b" opacity="0.5"/>
    <circle cx="760" cy="240" r="3" fill="#fb923c" opacity="0.45"/>
    <circle cx="850" cy="190" r="4" fill="#fbbf24" opacity="0.5"/>
  </g>
</svg>