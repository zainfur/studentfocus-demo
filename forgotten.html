<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Reset Password | StudentFocus</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body style="background-color: #f7f7f5; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0;">

    <div class="login-card">
        <div style="display: flex; justify-content: center; margin-bottom: 24px;">
            <a href="index.html" style="color: var(--brand-blue);">
                <i data-lucide="book-open" style="width: 40px; height: 40px;"></i>
            </a>
        </div>

        <h2 style="text-align: center; font-size: 24px; font-weight: 700; margin-bottom: 12px; letter-spacing: -0.02em;">
            Reset your password
        </h2>
        
        <p style="text-align: center; font-size: 14px; color: var(--notion-secondary); margin-bottom: 32px; padding: 0 10px;">
            Enter your email address and we'll send you a link to reset your password.
        </p>

        <div class="field">
            <label>Email address</label>
            <input type="email" placeholder="name@company.com" style="margin-bottom: 24px;">
        </div>

        <button class="btn-primary" style="display: block; width: 100%; text-align: center; border: none;">
            Send reset link
        </button>

        <div style="margin-top: 24px; text-align: center; font-size: 14px;">
            <a href="login.html" style="color: var(--notion-secondary); display: inline-flex; align-items: center; gap: 6px;">
                <i data-lucide="arrow-left" style="width: 14px; height: 14px;"></i>
                Back to login
            </a>
        </div>
    </div>

    <script>
        lucide.createIcons();
    </script>
</body>
</html>
