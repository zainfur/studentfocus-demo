<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Semester View | StudentFocus</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/dashboard.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="../js/app.js" defer></script>
</head>
<body class="dashboard-wrapper">
    <div id="sidebar-placeholder"></div>

    <main class="main-content">
        <div class="content-container">
            <header class="dashboard-header" style="display: flex; justify-content: space-between; align-items: center;">
                <div>
                    <a href="dashboard.html" style="font-size: 12px; color: var(--brand-blue); display: flex; align-items: center; gap: 4px; margin-bottom: 8px;">
                        <i data-lucide="arrow-left" class="icon-sm"></i> Back to Semesters
                    </a>
                    <h1 id="semester-display-title">Current Semester</h1>
                </div>
                <button class="btn-primary" onclick="openModal('module-modal')">+ New Module</button>
            </header>

            <div class="module-grid" id="module-grid">
                </div>
        </div>
    </main>

    <div id="module-modal" class="modal-overlay" style="display: none;">
        <div class="modal-card">
            <h2 style="margin-bottom: 24px;">Add New Module</h2>
            <div class="field">
                <label>Module Name</label>
                <input type="text" id="mod-name" placeholder="e.g. Data Structures">
            </div>
            <div class="field">
                <label>Description</label>
                <input type="text" id="mod-desc" placeholder="Brief overview...">
            </div>
            <div class="cta-row" style="margin-top: 32px; display: flex; justify-content: flex-end; gap: 12px;">
                <button onclick="closeModal('module-modal')" class="nav-item" style="background: none; border: none; width: auto; cursor: pointer;">Cancel</button>
                <button onclick="addModule()" class="btn-blue" style="padding: 10px 24px; border-radius: 6px;">Add Module</button>
            </div>
        </div>
    </div>
</body>
</html>
