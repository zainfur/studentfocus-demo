<div id="semester-modal" class="modal-overlay" style="display: none;">
    <div class="modal-card">
        <h2 style="margin-bottom: 24px;">Create New Semester</h2>
        <div class="field">
            <label>Semester Name</label>
            <input type="text" id="sem-name" placeholder="e.g. Year 1: Autumn Term">
        </div>
        
        <div style="display: flex; gap: 16px;">
            <div class="field" style="flex: 1;">
                <label>Start Date</label>
                <input type="date" id="sem-start">
            </div>
            <div class="field" style="flex: 1;">
                <label>End Date</label>
                <input type="date" id="sem-end">
            </div>
        </div>

        <div class="field">
            <label>Description (Optional)</label>
            <input type="text" id="sem-desc" placeholder="e.g. Focused on Core Engineering">
        </div>

        <div class="cta-row" style="margin-top: 32px; display: flex; justify-content: flex-end; gap: 12px;">
            <button onclick="closeModal('semester-modal')" class="nav-item" style="background: none; border: none; width: auto; cursor: pointer;">Cancel</button>
            <button onclick="addSemester()" class="btn-blue" style="padding: 10px 24px; border-radius: 6px;">Create Semester</button>
        </div>
    </div>
</div>
