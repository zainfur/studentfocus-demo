<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Lectures | StudentFocus</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/dashboard.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="../js/app.js" defer></script>
</head>
<body class="dashboard-wrapper">
    <div id="sidebar-placeholder"></div>

    <main class="main-content">
        <div class="content-container">
            <header class="dashboard-header" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 32px;">
                <div>
                    <a href="semester.html" style="font-size: 12px; color: var(--brand-blue); display: flex; align-items: center; gap: 4px; margin-bottom: 8px;">
                        <i data-lucide="arrow-left" class="icon-sm"></i> Back to Module
                    </a>
                    <h1>Module Lectures</h1>
                </div>
                <button class="btn-primary" onclick="openModal('lecture-modal')">+ New Lecture</button>
            </header>

            <section class="module-card" style="margin-bottom: 24px; padding: 24px;">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                    <h3 style="font-size: 18px; display: flex; align-items: center; gap: 10px;">
                        <i data-lucide="file-text" class="icon-blue"></i> Past Exam Papers
                    </h3>
                    <button class="btn-blue" style="font-size: 13px; padding: 8px 16px;" onclick="openModal('paper-modal')">
                        + Upload Paper
                    </button>
                </div>
                <div id="papers-list" style="display: flex; flex-direction: column; gap: 12px;"></div>
            </section>

            <section class="module-card" style="margin-bottom: 48px; padding: 20px; background: #F9F9F8;">
                <div style="display: flex; justify-content: space-between; align-items: flex-start;">
                    <div style="flex: 1; padding-right: 20px;">
                        <h4 style="margin: 0 0 8px; font-size: 14px; color: var(--notion-secondary); text-transform: uppercase; letter-spacing: 0.05em;">Module Syllabus & Outcomes</h4>
                        <p id="module-info-preview" style="font-size: 14px; line-height: 1.5; color: var(--notion-text); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;">
                            No syllabus information added yet.
                        </p>
                    </div>
                    <button class="pill" style="border: 1px solid var(--notion-border); background: white;" onclick="openModal('info-modal')">
                        Edit Info
                    </button>
                </div>
            </section>

            <h3 style="font-size: 16px; margin-bottom: 16px; color: var(--notion-secondary);">Lecture Recordings</h3>
            <div class="module-grid" id="lecture-grid"></div>
        </div>
    </main>

    <div id="lecture-modal" class="modal-overlay" style="display: none;">
        <div class="modal-card">
            <h2>Add New Lecture</h2>
            <div class="field">
                <label>Lecture Title</label>
                <input type="text" id="lecture-title" placeholder="e.g. Week 1: Introduction">
            </div>
            <div class="field">
                <label>Date</label>
                <input type="date" id="lecture-date">
            </div>
            <div class="cta-row">
                <button onclick="closeModal('lecture-modal')" class="nav-item">Cancel</button>
                <button onclick="addLecture()" class="btn-blue">Create Lecture</button>
            </div>
        </div>
    </div>

    <div id="paper-modal" class="modal-overlay" style="display: none;">
        <div class="modal-card">
            <h2>Upload Past Paper</h2>
            <div class="field">
                <label>Paper Title</label>
                <input type="text" id="paper-title" placeholder="e.g. 2024 Exam">
            </div>
            <div class="field">
                <label>Date</label>
                <input type="date" id="paper-date">
            </div>
            <div class="cta-row">
                <button onclick="closeModal('paper-modal')" class="nav-item">Cancel</button>
                <button onclick="addPastPaper()" class="btn-blue">Upload</button>
            </div>
        </div>
    </div>

    <div id="info-modal" class="modal-overlay" style="display: none;">
        <div class="modal-card">
            <h2>Module Info</h2>
            <textarea id="info-textarea" placeholder="Paste syllabus or outcomes..." style="width: 100%; height: 200px; border: 1px solid var(--notion-border); border-radius: 8px; padding: 12px; font-family: inherit; margin-bottom: 4px; resize: none;"></textarea>
            <div id="char-counter-container" style="text-align: right; font-size: 11px; color: var(--notion-secondary); margin-bottom: 16px;">
                <span id="current-chars">0</span> / 2500 characters
            </div>
            <div class="cta-row">
                <button onclick="closeModal('info-modal')" class="nav-item">Cancel</button>
                <button onclick="saveModuleInfo()" class="btn-blue">Save Info</button>
            </div>
        </div>
    </div>
</body>
</html>
