<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Lectures | StudentFocus</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/dashboard.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="../js/app.js" defer></script>
</head>
<body class="dashboard-wrapper">
    <div id="sidebar-placeholder"></div>

    <main class="main-content">
        <div class="content-container">
            <header class="dashboard-header" style="display: flex; justify-content: space-between; align-items: center;">
                <div>
                    <a href="semester.html" style="font-size: 12px; color: var(--brand-blue); display: flex; align-items: center; gap: 4px; margin-bottom: 8px;">
                        <i data-lucide="arrow-left" class="icon-sm"></i> Back to Module
                    </a>
                    <h1>Module Lectures</h1>
                </div>
                <button class="btn-primary" onclick="openModal('lecture-modal')">+ New Lecture</button>
            </header>

            <div class="module-grid" id="lecture-grid">
                <div id="empty-state" style="grid-column: 1 / -1; text-align: center; padding: 60px 0;">
                    <i data-lucide="mic" style="width: 48px; height: 48px; color: #EBEBE9; margin-bottom: 16px;"></i>
                    <h2 style="color: var(--notion-secondary);">No lectures yet</h2>
                    <p style="color: var(--notion-secondary); margin-top: 8px;">Upload a lecture recording or YouTube link to start.</p>
                </div>
            </div>
        </div>
    </main>

    <div id="lecture-modal" class="modal-overlay" style="display: none;">
        <div class="modal-card">
            <h2 style="margin-bottom: 24px;">Add New Lecture</h2>
            <div class="field">
                <label>Lecture Title</label>
                <input type="text" id="lecture-title" placeholder="e.g. Week 1: Introduction">
            </div>
            <div class="field">
                <label>Date</label>
                <input type="date" id="lecture-date">
            </div>
            <div class="cta-row" style="margin-top: 32px; display: flex; justify-content: flex-end; gap: 12px;">
                <button onclick="closeModal('lecture-modal')" class="nav-item" style="background: none; border: none; width: auto; cursor: pointer;">Cancel</button>
                <button onclick="addLecture()" class="btn-blue" style="padding: 10px 24px; border-radius: 6px;">Create Lecture</button>
            </div>
        </div>
    </div>
</body>
</html>
